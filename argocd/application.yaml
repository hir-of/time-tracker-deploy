# アプリ本体(Helm チャート)を同期する Application。
#
# **イメージタグの更新経路**
#   アプリ側リポジトリ(hir-of/time-tracker)の CI がイメージを build/push
#     → このリポジトリの values-baas-test.yaml の tag を書き換える PR を作成
#     → マージ
#     → ArgoCD が検知して同期(automated)
#
# **releaseName を time-tracker にしている理由**
# 既に手動 `helm install time-tracker` で作られたリソースが稼働している。
# releaseName を変えると別リリース扱いになりリソース名が全て変わってしまう。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: time-tracker
  namespace: argocd
spec:
  project: c-furukawa-test

  source:
    repoURL: https://github.com/hir-of/time-tracker-deploy.git
    targetRevision: main
    path: charts/time-tracker
    helm:
      releaseName: time-tracker
      valueFiles:
        - values-baas-test.yaml
      parameters:
        # namespace は kubectl 管理下(Helm の所有権メタデータを持たない)。
        # チャートに作らせようとすると invalid ownership metadata で失敗する
        - name: global.createNamespace
          value: "false"

  destination:
    server: https://7ffc7a95.kubo-test.hexabase.io:6443
    namespace: time-tracker

  # **手動同期**。`automated` は意図的に設定していない。
  #
  # 自動同期にすると、デプロイ用リポジトリの main が動いた瞬間に本番へ反映される。
  # 検証環境でデモに使う都合上、**反映のタイミングを人が決められる**ほうが都合がよい
  # (説明の途中で Pod が入れ替わらない)。
  #
  # 反映するとき:
  #   argocd app sync argocd/time-tracker
  #
  # **自動同期にする場合は下記を戻す**。あわせて運用が変わる点に注意:
  #   - `selfHeal: true` にすると `kubectl scale` や `kubectl edit` による手当てが
  #     約 1 秒で巻き戻る。緊急時も Git 経由でしか変更できなくなる
  #   - `prune: true` は Git から消えたリソースをクラスタからも削除する
  #
  #   automated:
  #     prune: true
  #     selfHeal: true
  #     allowEmpty: false
  syncPolicy:
    syncOptions:
      - ServerSideApply=true

  # StatefulSet の volumeClaimTemplates は作成後に変更できず、クラスタ側で
  # 既定値が補完されるため恒久的な差分として残る。無視しないと
  # 永久に OutOfSync 表示になる
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
