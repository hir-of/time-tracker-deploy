# SealedSecret を同期する Application。
#
# **なぜアプリ本体と分けるのか**(組織の既存運用と同じ構成)
#   captain-bell-info          charts/captain            ← アプリ本体
#   captain-bell-info-secrets  sealed-secrets/bell-info  ← 秘密情報
#
# 理由は 2 つ。
# 1. **更新の理由が違う**。Secret はローテーション時にしか変わらないが、
#    アプリはリリースのたびにイメージタグが変わる
# 2. **同期の順序**。Pod は Secret が存在しないと起動できない。別 Application に
#    しておくと、こちらだけ先に同期して確実に用意できる
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: time-tracker-secrets
  namespace: argocd
spec:
  project: c-furukawa-test

  source:
    repoURL: https://github.com/hir-of/time-tracker-deploy.git
    targetRevision: main
    # ディレクトリ配下の YAML をそのまま適用する(Helm ではない)
    path: sealed-secrets

  destination:
    server: https://7ffc7a95.kubo-test.hexabase.io:6443
    namespace: time-tracker

  syncPolicy:
    automated:
      # Git から消えたリソースはクラスタからも消す
      prune: true
      # クラスタ側が手で書き換えられたら Git の状態に戻す
      selfHeal: true
      # 誤って空の同期(全削除)が走るのを防ぐ
      allowEmpty: false
    syncOptions:
      # namespace は kubectl で作成済み。CreateNamespace は付けない
      # (AppProject の clusterResourceWhitelist が空のため作成できない)
      - ServerSideApply=true
