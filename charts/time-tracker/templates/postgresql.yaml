{{- if .Values.postgresql.enabled }}
{{- $name := include "time-tracker.name" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ .Values.postgresql.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "time-tracker.labels" . | nindent 4 }}
spec:
  # StatefulSet の安定したネットワーク ID を提供する
  clusterIP: None
  ports:
    - port: {{ .Values.postgresql.port }}
      targetPort: postgres
      name: postgres
  selector:
    {{- include "time-tracker.selectorLabels" (dict "root" . "component" .Values.postgresql.name) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-{{ .Values.postgresql.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "time-tracker.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}-{{ .Values.postgresql.name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "time-tracker.selectorLabels" (dict "root" . "component" .Values.postgresql.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "time-tracker.labels" . | nindent 8 }}
        {{- include "time-tracker.selectorLabels" (dict "root" . "component" .Values.postgresql.name) | nindent 8 }}
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgresql.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: password
            # 公式イメージは PGDATA が volume のルートだと初期化に失敗するため
            # サブディレクトリを指定する(lost+found 等が同居するため)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.user | quote }}, "-d", {{ .Values.postgresql.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgresql.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
{{- end }}
